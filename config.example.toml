[api]
bind = "127.0.0.1"         # Agent listens locally, Nginx proxies from port 443
port = 8443                 # Internal port (not visible to users when behind Nginx)
api_key = "bh_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"  # Minimum 32 chars total (including bh_ prefix)
path_prefix = "/xxxxxx"    # Random prefix, generated by 'banhammer-agent init'

# Direct access without Nginx (uncomment and set bind to 0.0.0.0):
# bind = "0.0.0.0"
# tls_cert = "/etc/banhammer/cert.pem"
# tls_key = "/etc/banhammer/key.pem"

[agent]
# server_id = "my-server"  # Default: hostname
poll_interval = 60

[fail2ban]
log_path = "/var/log/fail2ban.log"
client_path = "/usr/bin/fail2ban-client"

[storage]
db_path = "/var/lib/banhammer/banhammer.db"
retention_days = 90

[geo]
# Path to GeoLite2-City.mmdb (optional, enables geo-enrichment)
# geoip_db_path = "/var/lib/banhammer/GeoLite2-City.mmdb"
