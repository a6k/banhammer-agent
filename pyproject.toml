[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banhammer-agent"
version = "0.1.0"
description = "Lightweight agent that monitors Fail2Ban and forwards events to the BanHammer backend"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
banhammer-agent = "banhammer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
