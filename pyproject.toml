[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banhammer-agent"
version = "0.2.0"
description = "Lightweight agent that monitors Fail2Ban and serves a local API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "tomli>=2.0; python_version < '3.11'",
    "httpx>=0.27",
]

[project.optional-dependencies]
geo = ["geoip2>=4.8"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
banhammer-agent = "banhammer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
